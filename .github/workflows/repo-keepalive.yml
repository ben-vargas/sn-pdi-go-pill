name: Repository Keepalive

# Prevents GitHub from disabling scheduled workflows after 60 days of repo inactivity.
# A push/commit resets the inactivity timer for all workflows in the repo.

on:
  schedule:
    - cron: '0 12 1 */2 *'  # 1st of every other month at noon UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update keepalive timestamp
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/.keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/.keepalive
          git diff --staged --quiet || git commit -m "chore: repo keepalive $(date -u +%Y-%m-%d)"
          git push
